version: '3.4'

services:
  humanmanagement:
    build:
      context: ./HumanManagement    
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "8081:81"

    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - productnetwork
    restart: on-failure

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "11433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    networks:
      - productnetwork

networks:
  productnetwork:

volumes:
  sqlvolume:
